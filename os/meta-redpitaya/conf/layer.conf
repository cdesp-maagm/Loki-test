# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "redpitaya"
BBFILE_PATTERN_redpitaya = "^${LAYERDIR}/"
BBFILE_PRIORITY_redpitaya = "5"

LAYERDEPENDS_redpitaya = "xilinx"
LAYERSERIES_COMPAT_redpitaya = "thud"
