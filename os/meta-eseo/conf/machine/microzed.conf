
# Définition personnalisée de la carte MicroZed pour
# pour forcer la version de U-Boot la plus récente "u-boot-xlnx".

SOC_VARIANT ?= "7z"

require conf/machine/include/tune-zynq.inc
require conf/machine/include/machine-xilinx-overrides.inc
require conf/machine/include/machine-xilinx-default.inc
require conf/machine/include/machine-xilinx-board.inc

UBOOT_MACHINE = "zynq_zed_config"
SPL_BINARY = "spl/boot.bin"

EXTRA_IMAGEDEPENDS += " \
		u-boot-zynq-uenv \
		virtual/boot-bin \
		"

SERIAL_CONSOLE = "115200 ttyPS0"

KERNEL_DEVICETREE = "zynq-microzed.dtb"

IMAGE_BOOT_FILES += "boot.bin ${KERNEL_IMAGETYPE}-zynq-microzed.dtb uEnv.txt"
