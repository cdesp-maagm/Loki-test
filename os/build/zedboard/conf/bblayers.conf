# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

ROOTDIR = "${TOPDIR}/../.."

BBLAYERS ?= " \
    ${ROOTDIR}/poky/meta \
    ${ROOTDIR}/poky/meta-poky \
    ${ROOTDIR}/poky/meta-yocto-bsp \
    ${ROOTDIR}/meta-openembedded/meta-oe \
    ${ROOTDIR}/meta-openembedded/meta-python \
    ${ROOTDIR}/meta-openembedded/meta-networking \
    ${ROOTDIR}/meta-xilinx/meta-xilinx-bsp \
    ${ROOTDIR}/meta-redpitaya \
    ${ROOTDIR}/meta-iris \
    ${ROOTDIR}/meta-misc \
    ${ROOTDIR}/meta-eseo \
    "
